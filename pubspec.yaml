name: crypton
description: CryptoN Video Editor
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.9.2
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  path: ^1.9.0
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
